
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zona360. Discover our projects and services.">
  <meta name="theme-color" content="#101827">
  <title>Zona360 | Our Projects</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 55px 24px 30px;
      background: #101827;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .brand-logo {
      display: block;
      width: 140px;
      height: 140px;
      object-fit: contain;
      margin: 0 auto 16px;
    }

    .brand-name {
      font-size: clamp(42px, 9vw, 68px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1.1;
    }

    .brand-name span {
      color: #38bdf8;
    }

    header p {
      margin-top: 16px;
      color: #b8c4d6;
      font-size: 17px;
      line-height: 1.7;
    }

    .section-title {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .projects {
      display: grid;
      gap: 16px;
    }

    .project {
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 120px;
      padding: 20px 24px;
      background: #151f30;
      border: 1px solid #334155;
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      transition: transform .2s, background .2s, border-color .2s;
    }

    .project:hover {
      transform: translateY(-3px);
      background: #1e293b;
      border-color: #38bdf8;
    }

    .project-image {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      border-radius: 12px;
      padding: 7px;
    }

    .project-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .project-info {
      flex: 1;
      min-width: 0;
    }

    .project-info h2 {
      margin: 0 0 7px;
      font-size: 21px;
      font-weight: 700;
    }

    .project-info p {
      margin: 0;
      color: #a7b4c7;
      font-size: 14px;
      line-height: 1.6;
    }

    .arrow {
      color: #38bdf8;
      font-size: 25px;
      flex-shrink: 0;
    }

    footer {
      margin-top: 55px;
      text-align: center;
      color: #8190a5;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 40px 16px 24px;
      }

      .brand-logo {
        width: 110px;
        height: 110px;
      }

      header {
        margin-bottom: 36px;
      }

      .project {
        gap: 14px;
        padding: 16px;
      }

      .project-image {
        width: 62px;
        height: 62px;
      }

      .project-info h2 {
        font-size: 18px;
      }

      .project-info p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <img class="brand-logo" src="/logo.png" alt="Zona360 logo">
      <div class="brand-name">ZONA<span>360</span></div>
      <p>A central place to discover our projects and services.</p>
    </header>

    <section aria-labelledby="projects-heading">
      <h1 id="projects-heading" class="section-title">Our Projects</h1>

      <nav class="projects" aria-label="Our websites">

        <a class="project"
           href="https://odiamemas.com"
           target="_blank"
           rel="noopener noreferrer">
          <div class="project-image">
            <img src="https://www.odiamemas.com/imgs/logo.png"
                 alt="Ódiame Más logo">
          </div>
          <div class="project-info">
            <h2>Ódiame Más</h2>
            <p>Club América. Historia, comunidad y pasión.</p>
          </div>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <a class="project"
           href="https://YOUR-YARDA360-DOMAIN"
           target="_blank"
           rel="noopener noreferrer">
          <div class="project-image">
            <img src="/logo.png" alt="Yarda360 logo">
          </div>
          <div class="project-info">
            <h2>Yarda360</h2>
            <p>Discover Yarda360 and its services.</p>
          </div>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

      </nav>
    </section>

    <footer>
      &copy; 2026 Zona360. All rights reserved.
    </footer>
  </main>
</body>
</html>
